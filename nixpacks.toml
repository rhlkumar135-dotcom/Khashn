[phases.setup]
nixPkgs = ["bun"]

[phases.install]
cmds = ["bun install", "if [ -n \"$DATABASE_URL\" ]; then sed -i 's/provider = \"sqlite\"/provider = \"postgresql\"/' prisma/schema.prisma; fi", "bun x prisma generate", "bun run generate"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run railway:setup && bun run start"
